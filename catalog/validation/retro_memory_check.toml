# Настройки завершения теста и каскада чекпоинтов
[критерий_останова]
условие = "ВЫХОД_ИЗ_СТВОРА"
дистанция_после_соосности_метров = 50.0
макс_таймаут_сек = 120.0

[логика_валидации]
тип_проверки = "КАСКАД_УСЛОВИЙ"

  [[логика_валидации.уровни]]
  время_контроля_сек = 10.0
  ожидаемый_статус_ПО = "TRACK_CONFIRMED"
  проверять_сохранение_id = false
  примечание = "ПО обязано выполнить межинтервальную селекцию и устойчиво захватить цель на подлете"

  [[логика_валидации.уровни]]
  время_контроля_сек = 42.0
  ожидаемый_статус_ПО = "TRACK_EXTRAPOLATED"
  `проверять_сохранение_id = true`
  примечание = "Цель на перпендикуляре траверза (отметки пропали). Движок обязан удерживать трассу в памяти"

  [[логика_валидации.уровни]]
  время_контроля_сек = 60.0
  ожидаемый_статус_ПО = "TRACK_RESTORED"
  `проверять_сохранение_id = true`
  примечание = "Выход из слепой зоны. Проверка ретроспективного восстановления цели под СТАРЫМ сквозным ID"
