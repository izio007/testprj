# Данный блок автоматически рекурсивно укладывается в правила верификации ядра симулятора

[критерий_останова]
условие = "ВЫХОД_ИЗ_СТВОРА"
дистанция_после_соосности_метров = 60.0
макс_таймаут_сек = 150.0

[логика_валидации]
тип_проверки = "КАСКАД_УСЛОВИЙ"

  # Чекпоинт 1: Проверка завязки трассы межинтервальной селекцией на этапе подлета
  [[логика_валидации.уровни]]
  время_контроля_сек = 15.0
  ожидаемый_статус_ПО = "TRACK_CONFIRMED"
  проверять_сохранение_id = false
  примечание = "ПО должно устойчиво сопровождать БПЛА до входа в мертвую зону"

  # Чекпоинт 2: Проверка архивного удержания (экстраполяции) трассы в ОЗУ в мертвой зоне
  [[логика_валидации.уровни]]
  время_контроля_сек = 38.5
  ожидаемый_статус_ПО = "TRACK_EXTRAPOLATED"
  проверять_сохранение_id = true
  примечание = "Отметки пропали на траверзе. ПО обязано удерживать трассу в архиве памяти"

  # Чекпоинт 3: Ретроспективное восстановление сквозного ID трассы при выходе из соосности
  [[логика_валидации.уровни]]
  время_контроля_сек = 55.0
  ожидаемый_статус_ПО = "TRACK_RESTORED"
  проверять_сохранение_id = true
  # Если track_id изменился (стал новым) — тест автоматически выбросит статус БРАК
  # Так как это означает, что межинтервальная селекция порвала трассу на две части.
  примечание = "Цель вышла из слепой зоны. Проверяем восстановление под старым ID трассы"
